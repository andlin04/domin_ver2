<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}domin{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', path='favicon.svg').path }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css').path }}">
  <script src="{{ url_for('static', path='theme.js').path }}"></script>
</head>
<body data-page="{% block page %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      domin
    </a>
    <nav>
      <a href="/" class="{{ 'active' if self.page() == 'overview' }}">Overview</a>
      <a href="/tools" class="{{ 'active' if self.page() == 'tools' }}">Tools</a>
      {% if show_admin %}<a href="/admin" class="{{ 'active' if self.page() == 'admin' }}">Admin</a>{% endif %}
    </nav>
    <form class="jump" action="/d/" data-jump>
      <input name="q" placeholder="Go to domain…" autocomplete="off" list="domain-list" aria-label="Go to domain">
    </form>
    <button class="icon-btn" id="theme" title="Toggle light / dark" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
    </button>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">domin · domain inventory · data from certificate transparency, DNS and RDAP</footer>
  <script src="{{ url_for('static', path='vendor/chart.umd.min.js').path }}"></script>
  <script src="{{ url_for('static', path='app.js').path }}"></script>
</body>
</html>
