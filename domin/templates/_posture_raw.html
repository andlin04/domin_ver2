<p class="small-print muted">Parameters: profile <b>{{ p.profile or '—' }}</b> · ports <span class="mono">{{ p.ports }}</span>
  · version intensity {{ p.intensity }} · T{{ p.timing }} · timeout {{ p.timeout }} s</p>
{% if p.params %}<p class="small-print mono">{{ p.params }}</p>{% endif %}
{% if p.raw %}
<details class="raw">
  <summary>Raw nmap output <small class="muted">{{ p.raw|length }} bytes, XML</small></summary>
  <pre class="raw-out">{{ p.raw }}</pre>
</details>
{% endif %}
