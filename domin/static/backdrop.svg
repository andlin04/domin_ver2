    <circle cx="450" cy="170" r="16"/><circle cx="560" cy="520" r="15" stroke-dasharray="2 5"/>
  </g>
  <!-- lateral movement: dashed arcs with arrow heads -->
  <g stroke-width="1.4" stroke-dasharray="6 7">
    <path d="M60 520 Q200 420 360 330"/><path d="M360 330 Q480 250 600 110"/><path d="M200 560 Q380 640 560 520"/>
