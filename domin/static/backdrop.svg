<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round">
  <!-- decorative backdrop tile (mask only: the page colours it); network graph, attack paths, packet fragments -->
  <g opacity=".9">
    <path d="M60 80 L190 140 L320 90 L450 170 L600 110 M190 140 L230 290 L360 330 L450 170 M230 290 L110 380 L60 520
             M360 330 L520 360 L650 300 L600 110 M520 360 L560 520 L680 600 M360 330 L330 480 L200 560 L110 380
             M330 480 L470 600 L560 520 M200 560 L250 690 M470 600 L430 710 M650 300 L710 240"/>
  </g>
  <g fill="#000" stroke="none">
    <circle cx="60" cy="80" r="4"/><circle cx="190" cy="140" r="6"/><circle cx="320" cy="90" r="3.5"/>
    <circle cx="450" cy="170" r="7"/><circle cx="600" cy="110" r="4"/><circle cx="230" cy="290" r="4.5"/>
    <circle cx="360" cy="330" r="8"/><circle cx="110" cy="380" r="4"/><circle cx="60" cy="520" r="3.5"/>
