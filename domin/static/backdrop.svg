    <text x="400" y="40">4d 5a 90 00 03 00 00 00 04 00</text>
    <text x="470" y="260">CVE-20xx · RCE</text>
    <text x="24" y="250">ff fe 00 1b 7a 3c</text>
    <text x="250" y="420">GET /admin HTTP/1.1</text>
    <text x="40" y="640">10.0.0.0/8 · 22 · 3389</text>
    <text x="560" y="680">0x7f 45 4c 46</text>
    <text x="380" y="700">T1190 &#8594; T1021</text>
  </g>
  <!-- port grid fragment -->
