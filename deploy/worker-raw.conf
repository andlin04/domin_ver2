# Raw network access for the scan worker (Settings > Raw network access): nmap SYN scans (-sS --privileged).
# Not root: two capabilities, plus AF_PACKET for nmap's packet capture. Install:
#   install -m 0644 deploy/worker-raw.conf /etc/systemd/system/domin-worker.service.d/30-raw.conf
#   systemctl daemon-reload && systemctl restart domin-worker
# Remove the file (then daemon-reload + restart) to take it away again; scans fall back to connect scans.
[Service]
CapabilityBoundingSet=CAP_NET_RAW CAP_NET_ADMIN
AmbientCapabilities=CAP_NET_RAW CAP_NET_ADMIN
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK AF_PACKET
