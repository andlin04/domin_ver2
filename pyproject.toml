[project]
name = "domin"
version = "2.0.0"
description = "Domain inventory: host names, addresses and hosting providers per domain, over time"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx[socks]>=0.27",   # socks: scan routes through Tor, Mullvad or a socks5 proxy
    "dnspython>=2.6",
    "ipwhois>=1.3",
    "pycountry>=24.6",
    "fpdf2>=2.8",           # posture reports as PDF (domin/reports.py)
    "segno>=1.6",           # two-factor setup QR code (domin/totp.py)
    "cryptography>=44",     # Fernet: two-factor secrets encrypted at rest (domin/secretbox.py)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["domin"]

[tool.setuptools.package-data]
domin = ["templates/*.html", "static/*", "static/vendor/*", "resolvers.txt"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
