[project]
name = "domin"
version = "2.0.0"
description = "Domain DNS and security posture inventory: host names, hosting, exposed services and CVEs per domain, over time"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andreas Lindkvist" }]
keywords = ["dns", "inventory", "attack-surface", "nmap", "cve", "security", "fastapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx[socks]>=0.27",   # socks: scan routes through Tor, Mullvad or a socks5 proxy
    "dnspython>=2.6",
    "ipwhois>=1.3",
    "pycountry>=24.6",
    "fpdf2>=2.8",           # posture reports as PDF (domin/reports.py)
    "segno>=1.6",           # two-factor setup QR code (domin/totp.py)
    "cryptography>=44",     # Fernet: two-factor secrets encrypted at rest (domin/secretbox.py)
]

[project.urls]
Homepage = "https://github.com/andlin04/domin_ver2"
Documentation = "https://github.com/andlin04/domin_ver2/tree/main/docs"
Changelog = "https://github.com/andlin04/domin_ver2/blob/main/CHANGES.md"
Issues = "https://github.com/andlin04/domin_ver2/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["domin"]

[tool.setuptools.package-data]
domin = ["templates/*.html", "static/*", "static/vendor/*", "resolvers.txt"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
