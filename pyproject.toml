[project]
name = "domin"
version = "2.0.0"
description = "Domain inventory: host names, addresses and hosting providers per domain, over time"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "dnspython>=2.6",
    "ipwhois>=1.3",
    "pycountry>=24.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["domin"]

[tool.setuptools.package-data]
domin = ["templates/*.html", "static/*", "static/vendor/*", "resolvers.txt"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
